<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petto Petto — 비전 합성소</title>
    <link rel="stylesheet" href="../../pet-shell/ui/tokens.css" />
    <link rel="stylesheet" href="../../pet-shell/ui/topbar.css" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- 패키지 빌드가 `@pet/shell`을 bare specifier 로 읽는다. 번들러가 없어 import map 으로 풀어 준다. -->
    <script type="importmap">
      {
        "imports": {
          "@pet/shell": "../../pet-shell/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- 640 화면 공통 상단 바(`@pet/shell`). 다른 화면으로 가는 길과 토큰, 닫기가 여기 있다. -->
    <header class="petto-topbar" data-current="combine"></header>
    <main class="combine-shell">
      <section class="combine-stage" aria-labelledby="combine-title">
        <div class="stage-copy">
          <p>ARCANE COMBINE</p>
          <h1 id="combine-title">비전 합성소</h1>
          <span>10장의 카드를 섞어 새로운 친구를 만드세요</span>
        </div>
        <div class="combine-space" aria-label="합성 항아리">
          <div class="cauldron-reaction" aria-hidden="true">
            <span class="toxic-lava"></span>
            <span class="lava-bubble bubble-one"></span>
            <span class="lava-bubble bubble-two"></span>
            <span class="lava-bubble bubble-three"></span>
            <article class="forge-result-card"></article>
          </div>
        </div>
      </section>
      <section class="combine-panel" aria-label="합성 재료 선택">
        <div class="combine-tabs">
          <button data-grade="common">COMMON 합성</button
          ><button data-grade="rare">RARE 합성</button>
        </div>
        <div class="combine-summary">
          <strong class="combine-materials"></strong>
        </div>
        <p class="combine-message" role="status"></p>
        <div class="selection-slots"></div>
        <div class="pet-grid" tabindex="0" aria-label="선택 가능한 펫, 좌우로 스크롤"></div>
        <button class="combine-button">합성하기</button>
        <div class="combine-status">
          <output class="combine-result"></output>
          <p class="combine-requirement" role="status"></p>
        </div>
      </section>
    </main>
    <script type="module" src="./app.mjs"></script>
    <script type="module" src="../../pet-shell/dist/ui/topbar.js"></script>
  </body>
</html>
