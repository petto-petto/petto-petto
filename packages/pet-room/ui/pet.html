<meta charset="utf-8" />
<title>펫</title>
<link rel="stylesheet" href="pet.css" />

<!-- `@pet/room`의 컴파일 결과가 참조하는 bare specifier를 해석한다. petroom.html과 동일. -->
<script type="importmap">
  {
    "imports": {
      "@pet/core": "../../pet-core/dist/index.js"
    }
  }
</script>

<div id="stage">
  <div id="bubble" hidden></div>

  <canvas id="sprite" title="좌클릭 드래그로 이동 · 우클릭으로 메뉴"></canvas>

  <div id="menu" hidden>
    <button data-action="room">펫룸</button>
    <button data-screen="info">정보</button>
    <button data-screen="settings">설정</button>
    <button data-screen="achievements">업적</button>
  </div>
</div>

<script type="module" src="pet.js"></script>
