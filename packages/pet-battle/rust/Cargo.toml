[package]
name = "pet-battle-engine"
version = "0.1.0"
edition = "2024"
description = "Rust battle domain and JSON-lines sidecar for @pet/battle"
license = "MIT"

[lib]
name = "pet_battle"
path = "src/lib.rs"

[[bin]]
name = "pet-battle-engine"
path = "src/bin/pet-battle-engine.rs"

[[bin]]
name = "generate-battle-assets"
path = "src/bin/generate-battle-assets.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
