  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 32px;
      background: #171725;
      color: #ece7f0;
      font:
        14px -apple-system,
        sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }
    p {
      margin: 0 0 24px;
      color: #b4adbf;
    }
    h2 {
      margin: 24px 0 14px;
      font-size: 15px;
      font-weight: 500;
    }
    .lineup {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .faces {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    figure {
      margin: 0;
      padding: 22px 4px 16px;
      text-align: center;
      background: #242235;
      border: 1px solid #39354a;
    }
    img {
      display: block;
      margin: 0 auto 18px;
      height: 64px;
      width: auto;
      image-rendering: pixelated;
    }
    .faces img {
      height: 80px;
    }
    figcaption {
      color: #cac3d5;
      font-size: 13px;
    }
    .current {
      border-color: #77708b;
    }
    small {
      display: block;
      margin-top: 18px;
      color: #a69eb5;
    }
  </style>
