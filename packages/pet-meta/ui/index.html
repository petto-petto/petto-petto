<meta charset="utf-8" />
<title>메타 패널</title>
<link rel="stylesheet" href="panel.css" />

<header id="titlebar">
  <span id="grip" title="드래그해서 창 옮기기" aria-hidden="true"></span>
  <button class="screen-tab" data-screen="info" aria-selected="true">정보</button>
  <button class="screen-tab" data-screen="achievements" aria-selected="false">업적</button>
  <!--
    설정은 전용 화면이라 탭 자리에 두지 않는다. 들어가면 아래 둘이 탭을 대신한다.
    아이콘만 있는 버튼은 보이는 이름이 없으므로 `aria-label`로 이름을 준다.
  -->
  <button class="icon-button" id="back-button" aria-label="설정 나가기" title="설정 나가기" hidden>
    ←
  </button>
  <span id="mode-title" hidden>설정</span>
  <button class="icon-button" id="demo-button" aria-label="시연" title="프로토타입 시연용">
    ⚗&#xFE0E;
  </button>
  <button class="icon-button" id="close-button" aria-label="닫기" title="닫기">✕</button>
</header>

<nav id="subtabs"></nav>

<main id="content"></main>

<!--
  설정 입구. 화면 내용 위에 떠 있지 않고 자기 줄을 차지한다 — 겹치면 요약의 업적
  막대를 가린다.
-->
<footer id="panel-footer">
  <button
    class="icon-button"
    id="settings-button"
    data-screen="settings"
    aria-selected="false"
    aria-label="설정"
    title="설정"
  >
    ⚙&#xFE0E;
  </button>
</footer>

<script src="panel.js"></script>
