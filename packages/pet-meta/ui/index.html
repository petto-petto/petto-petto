<meta charset="utf-8" />
<title>Petto Petto — 정보</title>
<link rel="stylesheet" href="../../pet-shell/ui/tokens.css" />
<link rel="stylesheet" href="../../pet-shell/ui/topbar.css" />
<link rel="stylesheet" href="panel.css" />

<!-- 640 화면 공통 상단 바(`@pet/shell`). 정보는 640 창의 한 화면이다(동선 4단계). -->
<header class="petto-topbar" data-current="info"></header>

<header id="titlebar">
  <!--
    정보와 업적은 공통 상단 바의 탭이다(동선 4단계). 여기에는 지금 화면 이름과, 설정에서 나가는 길만 둔다.
    아이콘만 있는 버튼은 보이는 이름이 없으므로 `aria-label`로 이름을 준다.
  -->
  <button class="icon-button" id="back-button" aria-label="설정 나가기" title="설정 나가기" hidden>
    ←
  </button>
  <span id="mode-title">정보</span>
  <button class="icon-button" id="demo-button" aria-label="시연" title="프로토타입 시연용">
    ⚗&#xFE0E;
  </button>
</header>

<nav id="subtabs"></nav>

<main id="content"></main>

<!--
  설정 입구. 화면 내용 위에 떠 있지 않고 자기 줄을 차지한다 — 겹치면 요약의 업적
  막대를 가린다.
-->
<footer id="panel-footer">
  <button
    class="icon-button"
    id="settings-button"
    data-screen="settings"
    aria-selected="false"
    aria-label="설정"
    title="설정"
  >
    ⚙&#xFE0E;
  </button>
</footer>

<script type="module" src="panel.js"></script>
<script type="module" src="../../pet-shell/dist/ui/topbar.js"></script>
